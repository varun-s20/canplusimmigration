<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dolopreneur — Logo Reveal</title>

<!--
  ════════════════════════════════════════════════════════════════
  DOLOPRENEUR LOGO REVEAL  ·  customize here
  ────────────────────────────────────────────────────────────────
  • LOGO   : now an exact vector recreation of your real mark
             (charcoal squircle · white ring · white bar · chartreuse disc).
             Colors pulled from your file: charcoal #1F1F1F, white #FAFBF6,
             accent #E8E54A.
  • FONT   : set --word-font to your site's font (update the <link> too).
             Default = Bricolage Grotesque.
  • COLORS : --bone is your site background; --chartreuse drives the
             underline / CTA / glint and matches the logo disc.
  • SPEED  : on-screen Speed button, or change --T.
  • RECORD : Chrome → F11 fullscreen → press H to hide controls, R to replay,
             screen-record the tab at 1080p+. Background is solid bone.
  ════════════════════════════════════════════════════════════════
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@500;600&display=swap" rel="stylesheet">

<style>
  :root{
    /* ——— brand palette (pulled from your logo) ——— */
    --bone:#ECEAE3;        /* warm off-white background (your site) */
    --ink:#1F1F1F;         /* charcoal (matches logo tile) */
    --chartreuse:#E8E54A;  /* accent — exact from your logo disc */
    --card:#F7F6F1;
    --ink-soft:rgba(31,31,31,.60);

    /* ——— layout ——— */
    --mark-size:150px;
    --gap:36px;
    --word-font:"Bricolage Grotesque", sans-serif;

    /* timeline multiplier (Speed button; 1 = normal) */
    --T:1;

    /* computed at runtime */
    --mark-shift:0px;
    --word-shift:0px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bone);
    overflow:hidden;
    font-family:"Hanken Grotesk", sans-serif;
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* fixed 16:9 stage, scaled to fit the viewport by JS */
  .stage{
    position:fixed; left:50%; top:50%;
    width:1920px; height:1080px;
    transform-origin:center center;
    transform:translate(-50%,-50%) scale(1);
    background:var(--bone);
    overflow:hidden;
  }

  /* soft warm light + faint accent haze for depth (not a flat fill) */
  .glow{
    position:absolute; inset:0; pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% 46%, rgba(255,255,255,.66) 0%, rgba(255,255,255,0) 46%),
      radial-gradient(60% 50% at 50% 60%, rgba(232,229,74,.08) 0%, rgba(232,229,74,0) 60%);
  }
  /* film grain */
  .grain{
    position:absolute; inset:0; pointer-events:none; opacity:.05; mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  /* ——— the mark ——— */
  .mark{
    position:absolute; left:50%; top:50%;
    width:var(--mark-size); height:var(--mark-size);
    border-radius:18px; overflow:hidden;
    opacity:0;
    transform:translate(-50%,-50%) scale(.92);
    box-shadow:0 24px 60px -28px rgba(31,31,31,.45);
    will-change:transform,opacity;
  }
  .mark svg{display:block; width:100%; height:100%;}
  /* glint sweep, clipped to the mark */
  .glint{
    position:absolute; top:-50%; left:-30%;
    width:55%; height:200%;
    background:linear-gradient(120deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,.80) 45%,
      rgba(232,229,74,.55) 60%,
      rgba(255,255,255,0) 100%);
    transform:skewX(-12deg) translateX(-180%);
    opacity:0; pointer-events:none;
  }

  /* ——— the wordmark ——— */
  .wordmark{
    position:absolute; left:50%; top:50%;
    transform:translate(calc(-50% + var(--word-shift)), -50%);
    white-space:nowrap;
    font-family:var(--word-font);
    font-weight:800;
    font-size:96px;
    letter-spacing:-.025em;
    color:var(--ink);
    will-change:transform;
  }
  .wordmark .l{
    display:inline-block;
    opacity:0;
    transform:translateX(20px);
    filter:blur(5px);
    will-change:transform,opacity,filter;
  }

  /* ——— tagline + underline ——— */
  .tagline{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%, 116px);
    font-family:"Hanken Grotesk", sans-serif;
    font-weight:600; font-size:21px;
    letter-spacing:.34em; text-transform:uppercase;
    color:var(--ink-soft);
    opacity:0; white-space:nowrap;
  }
  .underline{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%, 150px);
    width:230px; height:3px; overflow:hidden;
  }
  .underline-fill{
    width:100%; height:100%; background:var(--chartreuse);
    border-radius:3px; transform:scaleX(0); transform-origin:left center;
  }

  /* ——— CTA pill ——— */
  .cta{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%, 268px);
    background:var(--chartreuse); color:var(--ink);
    font-family:"Hanken Grotesk", sans-serif; font-weight:600; font-size:18px;
    letter-spacing:.01em;
    padding:14px 30px; border-radius:999px;
    box-shadow:0 16px 36px -18px rgba(170,168,40,.6);
    opacity:0; white-space:nowrap;
  }

  /* ═══════════ animations — only run when .run is added ═══════════ */
  .stage.run .mark{
    animation:markAnim calc(4600ms * var(--T)) linear both;
  }
  .stage.run .glint{
    animation:glintAnim calc(760ms * var(--T)) cubic-bezier(.4,0,.2,1) calc(450ms * var(--T)) 1 both;
  }
  .stage.run .wordmark{
    animation:wordSlide calc(820ms * var(--T)) cubic-bezier(.22,1,.36,1) calc(1850ms * var(--T)) both;
  }
  .stage.run .wordmark .l{
    animation:letterIn calc(560ms * var(--T)) cubic-bezier(.2,1,.3,1) both;
    /* per-letter delay set inline by JS */
  }
  .stage.run .tagline{
    animation:fadeUp calc(700ms * var(--T)) cubic-bezier(.16,1,.3,1) calc(2700ms * var(--T)) both;
  }
  .stage.run .underline-fill{
    animation:drawLine calc(760ms * var(--T)) cubic-bezier(.16,1,.3,1) calc(2900ms * var(--T)) both;
  }
  .stage.run .cta{
    animation:fadeUp calc(620ms * var(--T)) cubic-bezier(.16,1,.3,1) calc(3520ms * var(--T)) both;
  }

  @keyframes markAnim{
    0%{   opacity:0; transform:translate(-50%,-50%) scale(.92);
          animation-timing-function:cubic-bezier(.16,1,.3,1); }
    26%{  opacity:1; transform:translate(-50%,-50%) scale(1); }
    40%{  transform:translate(-50%,-50%) scale(1);
          animation-timing-function:cubic-bezier(.22,1,.36,1); }
    58%{  transform:translate(calc(-50% - var(--mark-shift)), -50%) scale(1); }
    100%{ opacity:1; transform:translate(calc(-50% - var(--mark-shift)), -50%) scale(1); }
  }
  @keyframes glintAnim{
    0%{   transform:skewX(-12deg) translateX(-180%); opacity:0; }
    18%{  opacity:.95; }
    82%{  opacity:.95; }
    100%{ transform:skewX(-12deg) translateX(300%); opacity:0; }
  }
  @keyframes wordSlide{
    0%{   transform:translate(calc(-50% + var(--word-shift) + 30px), -50%); }
    100%{ transform:translate(calc(-50% + var(--word-shift)), -50%); }
  }
  @keyframes letterIn{
    0%{   opacity:0; transform:translateX(20px); filter:blur(5px); }
    60%{  filter:blur(0); }
    100%{ opacity:1; transform:translateX(0); filter:blur(0); }
  }
  @keyframes fadeUp{
    0%{   opacity:0; }
    100%{ opacity:1; }
  }
  @keyframes drawLine{
    0%{   transform:scaleX(0); }
    100%{ transform:scaleX(1); }
  }

  /* ——— controls (hidden while playing / when toggled off) ——— */
  .controls{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px; align-items:center;
    background:rgba(247,246,241,.82); backdrop-filter:blur(8px);
    border:1px solid rgba(31,31,31,.10);
    padding:8px 10px; border-radius:999px;
    box-shadow:0 12px 30px -16px rgba(31,31,31,.4);
    font-family:"Hanken Grotesk",sans-serif;
    transition:opacity .3s ease;
    z-index:10;
  }
  .controls button{
    font:inherit; font-weight:600; font-size:14px; color:var(--ink);
    background:transparent; border:none; cursor:pointer;
    padding:8px 14px; border-radius:999px; transition:background .15s ease;
  }
  .controls button:hover{ background:rgba(31,31,31,.07); }
  .controls .primary{ background:var(--ink); color:var(--bone); }
  .controls .primary:hover{ background:#000; }
  .controls .hint{ font-size:12px; color:var(--ink-soft); padding:0 8px 0 4px; }
  body.playing .controls{ opacity:0; pointer-events:none; }
  body.hide-ui .controls{ display:none; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="glow"></div>

    <!-- ░░░ MARK — exact vector recreation of your logo ░░░ -->
    <div class="mark" id="mark">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-label="Dolopreneur">
        <rect x="0" y="0" width="200" height="200" rx="24" fill="#1F1F1F"/>
        <!-- white ring (the first 'o') -->
        <circle cx="49.5" cy="100" r="25.5" fill="none" stroke="#FAFBF6" stroke-width="11"/>
        <!-- white bar (the 'l') -->
        <rect x="87.5" y="62" width="10" height="76" rx="5" fill="#FAFBF6"/>
        <!-- chartreuse disc (the second 'o') -->
        <circle cx="149.5" cy="100" r="31" fill="#E8E54A"/>
      </svg>
      <div class="glint"></div>
    </div>
    <!-- ░░░ /MARK ░░░ -->

    <div class="wordmark" id="wordmark"><!-- letters injected by JS --></div>

    <div class="tagline">One operator. Every workflow.</div>
    <div class="underline"><div class="underline-fill"></div></div>

    <div class="cta">Book a demo</div>

    <div class="grain"></div>
  </div>

  <div class="controls" id="controls">
    <button class="primary" id="replay">↻ Replay</button>
    <button id="speed">Speed: 1×</button>
    <button id="hide">Hide UI</button>
    <span class="hint">R replay · H hide</span>
  </div>

<script>
  const stage    = document.getElementById('stage');
  const markEl   = document.getElementById('mark');
  const wordEl   = document.getElementById('wordmark');
  const WORD     = "Dolopreneur";
  const BASE_DELAY = 1850;   // ms — letters start as the mark slides left
  const STEP       = 34;     // ms — per-letter stagger
  const speeds   = [1, 0.8, 1.25];
  let speedIdx   = 0;
  let speed      = speeds[speedIdx];

  [...WORD].forEach((ch) => {
    const s = document.createElement('span');
    s.className = 'l';
    s.textContent = ch;
    wordEl.appendChild(s);
  });

  function applyLetterDelays(){
    [...wordEl.children].forEach((s, i) => {
      s.style.animationDelay = ((BASE_DELAY + i * STEP) * speed) + 'ms';
    });
  }

  function measure(){
    const Wm  = markEl.offsetWidth;
    const Ww  = wordEl.offsetWidth;
    const gap = parseFloat(getComputedStyle(stage).getPropertyValue('--gap')) || 36;
    stage.style.setProperty('--mark-shift', ((gap + Ww) / 2) + 'px');
    stage.style.setProperty('--word-shift', ((Wm + gap) / 2) + 'px');
  }

  function fitStage(){
    const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = `translate(-50%,-50%) scale(${s})`;
  }

  let playTimer;
  function play(){
    stage.classList.remove('run');
    void stage.offsetWidth;            // force reflow to restart
    stage.style.setProperty('--T', speed);
    applyLetterDelays();
    stage.classList.add('run');
    document.body.classList.add('playing');
    clearTimeout(playTimer);
    playTimer = setTimeout(() => document.body.classList.remove('playing'), 4900 * speed);
  }

  document.getElementById('replay').addEventListener('click', play);
  document.getElementById('hide').addEventListener('click', () => document.body.classList.toggle('hide-ui'));
  document.getElementById('speed').addEventListener('click', (e) => {
    speedIdx = (speedIdx + 1) % speeds.length;
    speed = speeds[speedIdx];
    e.target.textContent = 'Speed: ' + speed + '×';
    play();
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'r' || e.key === 'R') play();
    if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('hide-ui');
  });
  window.addEventListener('resize', fitStage);

  function boot(){ measure(); fitStage(); play(); }
  if (document.fonts && document.fonts.ready){
    document.fonts.ready.then(boot);
    setTimeout(boot, 1200);            // fallback if fonts hang
  } else {
    window.addEventListener('load', boot);
  }
</script>
</body>
</html>
